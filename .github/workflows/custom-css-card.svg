<svg fill="none" viewBox="0 0 850 190" width="850" height="190" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .card {
          font-family: 'Segoe UI', Ubuntu, Sans-Serif;
          background: linear-gradient(135deg, #16161e 0%, #1a1b27 50%, #1f2335 100%);
          border: 1px solid rgba(112, 165, 253, 0.3);
          border-radius: 16px;
          padding: 22px 30px;
          color: #c0caf5;
          box-sizing: border-box;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
          position: relative;
          overflow: hidden;
        }
        .glow-bar {
          position: absolute;
          top: 0;
          left: 0;
          height: 4px;
          width: 100%;
          background: linear-gradient(90deg, #70a5fd, #bf91f3, #38bdae, #70a5fd);
          background-size: 200% 100%;
          animation: moveGradient 4s linear infinite;
        }
        @keyframes moveGradient {
          0% { background-position: 0% 50%; }
          100% { background-position: 200% 50%; }
        }
        .title {
          font-size: 20px;
          font-weight: 700;
          color: #7dcfff;
          margin-bottom: 12px;
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .pulse {
          width: 10px;
          height: 10px;
          background-color: #9ece6a;
          border-radius: 50%;
          display: inline-block;
          box-shadow: 0 0 8px #9ece6a;
          animation: pulseAnim 2s infinite;
        }
        @keyframes pulseAnim {
          0% { transform: scale(0.95); opacity: 0.7; }
          50% { transform: scale(1.2); opacity: 1; }
          100% { transform: scale(0.95); opacity: 0.7; }
        }
        .grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 10px;
          font-size: 14.5px;
          line-height: 1.6;
        }
        .highlight {
          color: #bb9af7;
          font-weight: 600;
        }
        .code {
          background: rgba(112, 165, 253, 0.12);
          color: #70a5fd;
          padding: 2px 7px;
          border-radius: 6px;
          font-family: monospace;
          font-size: 13px;
        }
      </style>
      <div class="card">
        <div class="glow-bar"></div>
        <div class="title">
          <span class="pulse"></span>
          <span>Nevar334 // System &amp; Data Profile</span>
        </div>
        <div class="grid">
          <div>🐍 <b>Основной фокус:</b> разработка на <span class="code">Python</span> и работа с данными в <span class="code">PostgreSQL</span></div>
          <div>📊 <b>Data &amp; ML стек:</b> анализ и визуализация через <span class="code">NumPy</span>, <span class="code">Pandas</span>, <span class="code">Matplotlib</span></div>
          <div>🐳 <b>Инфраструктура:</b> контейнеризация в <span class="code">Docker</span> и контроль версий <span class="code">Git</span></div>
          <div>🎯 <b>Текущая цель:</b> углублённое изучение <span class="highlight">Machine Learning</span> и архитектуры БД</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
