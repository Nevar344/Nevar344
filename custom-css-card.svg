<svg fill="none" viewBox="0 0 860 230" width="860" height="230" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .terminal {
          font-family: 'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace;
          background: linear-gradient(145deg, #13141c 0%, #1a1b26 60%, #1f2335 100%);
          border: 1px solid rgba(122, 162, 247, 0.28);
          border-radius: 14px;
          color: #c0caf5;
          box-sizing: border-box;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
          overflow: hidden;
          position: relative;
        }
        .top-bar {
          background: rgba(22, 22, 30, 0.9);
          padding: 10px 18px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          border-bottom: 1px solid rgba(122, 162, 247, 0.15);
        }
        .dots {
          display: flex;
          gap: 8px;
        }
        .dot {
          width: 11px;
          height: 11px;
          border-radius: 50%;
        }
        .red { background: #f7768e; }
        .yellow { background: #e0af68; }
        .green { background: #9ece6a; }
        .tab-title {
          font-size: 12.5px;
          color: #7aa2f7;
          letter-spacing: 0.5px;
        }
        .status-pill {
          font-size: 11px;
          color: #9ece6a;
          background: rgba(158, 206, 106, 0.12);
          padding: 2px 10px;
          border-radius: 99px;
          border: 1px solid rgba(158, 206, 106, 0.3);
        }
        .content {
          padding: 20px 26px;
          display: grid;
          grid-template-columns: 1.15fr 0.85fr;
          gap: 24px;
        }
        .bio-line {
          font-size: 13.5px;
          line-height: 1.75;
          margin-bottom: 6px;
        }
        .prompt {
          color: #bb9af7;
          font-weight: bold;
          margin-right: 6px;
        }
        .tag {
          background: rgba(122, 162, 247, 0.14);
          color: #7dcfff;
          padding: 2px 7px;
          border-radius: 5px;
          font-size: 12.5px;
        }
        .bars {
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 12px;
        }
        .bar-item {
          font-size: 12px;
        }
        .bar-header {
          display: flex;
          justify-content: space-between;
          margin-bottom: 5px;
          color: #a9b1d6;
        }
        .bar-bg {
          width: 100%;
          height: 7px;
          background: #16161e;
          border-radius: 99px;
          overflow: hidden;
          border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .bar-fill {
          height: 100%;
          border-radius: 99px;
          background: linear-gradient(90deg, #7aa2f7, #bb9af7, #7dcfff);
          background-size: 200% 100%;
          animation: shimmer 3s linear infinite;
        }
        @keyframes shimmer {
          0% { background-position: 0% 50%; }
          100% { background-position: 200% 50%; }
        }
      </style>

      <div class="terminal">
        <div class="top-bar">
          <div class="dots">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
          </div>
          <div class="tab-title">nevar344@github:~/profile-overview</div>
          <div class="status-pill">● SYSTEM ONLINE</div>
        </div>

        <div class="content">
          <div>
            <div class="bio-line"><span class="prompt">❯</span><b>Role:</b> Python Developer &amp; Data Explorer</div>
            <div class="bio-line"><span class="prompt">❯</span><b>Core Stack:</b> <span class="tag">Python</span> <span class="tag">SQL</span> <span class="tag">PostgreSQL</span></div>
            <div class="bio-line"><span class="prompt">❯</span><b>Data &amp; ML:</b> <span class="tag">NumPy</span> <span class="tag">Pandas</span> <span class="tag">Matplotlib</span></div>
            <div class="bio-line"><span class="prompt">❯</span><b>Environment:</b> <span class="tag">Docker</span> <span class="tag">Git</span> <span class="tag">Linux</span></div>
          </div>

          <div class="bars">
            <div class="bar-item">
              <div class="bar-header"><span>Python &amp; SQL Backend</span><span>80%</span></div>
              <div class="bar-bg"><div class="bar-fill" style="width: 80%;"></div></div>
            </div>
            <div class="bar-item">
              <div class="bar-header"><span>Docker &amp; Git Workflow</span><span>75%</span></div>
              <div class="bar-bg"><div class="bar-fill" style="width: 75%;"></div></div>
            </div>
            <div class="bar-item">
              <div class="bar-header"><span>Data Science &amp; ML (Learning)</span><span>55%</span></div>
              <div class="bar-bg"><div class="bar-fill" style="width: 55%;"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
