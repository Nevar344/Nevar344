<svg fill="none" viewBox="0 0 880 185" width="880" height="185" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        .bento {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
          display: grid;
          grid-template-columns: 1.1fr 1fr 1fr;
          gap: 14px;
          padding: 4px;
          height: 180px;
          color: #c0caf5;
        }
        .card {
          background: linear-gradient(160deg, #16161e 0%, #1a1b26 100%);
          border: 1px solid rgba(122, 162, 247, 0.18);
          border-radius: 14px;
          padding: 18px 20px;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          position: relative;
          overflow: hidden;
        }
        .card::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 2px;
          background: linear-gradient(90deg, #7aa2f7, #bb9af7, #38bdae, #7aa2f7);
          background-size: 200% 100%;
          animation: flow 5s linear infinite;
        }
        @keyframes flow {
          0% { background-position: 0% 50%; }
          100% { background-position: 200% 50%; }
        }
        .label {
          font-size: 11px;
          text-transform: uppercase;
          letter-spacing: 1.4px;
          color: #565f89;
          font-weight: 700;
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        .status-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #9ece6a;
          box-shadow: 0 0 10px #9ece6a;
          animation: pulse 2s infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 0.5; transform: scale(0.9); }
          50% { opacity: 1; transform: scale(1.15); }
        }
        .main-title {
          font-size: 22px;
          font-weight: 700;
          color: #ffffff;
          letter-spacing: -0.3px;
          margin-top: 4px;
        }
        .sub {
          font-size: 13px;
          color: #a9b1d6;
          line-height: 1.45;
        }
        .pills {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
          margin-top: 6px;
        }
        .pill {
          font-family: 'JetBrains Mono', monospace;
          font-size: 11.5px;
          padding: 4px 9px;
          border-radius: 6px;
          background: rgba(122, 162, 247, 0.1);
          border: 1px solid rgba(122, 162, 247, 0.2);
          color: #7dcfff;
        }
        .pill.purple {
          background: rgba(187, 154, 247, 0.1);
          border-color: rgba(187, 154, 247, 0.2);
          color: #bb9af7;
        }
        .pill.teal {
          background: rgba(56, 189, 174, 0.1);
          border-color: rgba(56, 189, 174, 0.2);
          color: #73daca;
        }
        .footer-note {
          font-size: 11.5px;
          color: #7aa2f7;
          font-family: monospace;
        }
      </style>

      <div class="bento">
        <div class="card">
          <div class="label">
            <span>Profile</span>
            <span class="status-dot"></span>
          </div>
          <div>
            <div class="main-title">Nevar344</div>
            <div class="sub">Software Engineering &amp; Data Analysis</div>
          </div>
          <div class="footer-note">● Learning Machine Learning</div>
        </div>

        <div class="card">
          <div class="label">
            <span>Backend &amp; Infra</span>
            <span>01</span>
          </div>
          <div class="pills">
            <span class="pill">Python</span>
            <span class="pill">PostgreSQL</span>
            <span class="pill">SQL</span>
            <span class="pill teal">Docker</span>
            <span class="pill teal">Git</span>
            <span class="pill teal">Linux</span>
          </div>
          <div class="footer-note">Containerized workflows</div>
        </div>

        <div class="card">
          <div class="label">
            <span>Data &amp; ML</span>
            <span>02</span>
          </div>
          <div class="pills">
            <span class="pill purple">NumPy</span>
            <span class="pill purple">Pandas</span>
            <span class="pill purple">Matplotlib</span>
          </div>
          <div class="footer-note">Data processing &amp; plots</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
